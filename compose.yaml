services:
  db:
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: shift_scheduling
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - hcss_data:/var/lib/postgresql
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db

volumes:
  hcss_data: